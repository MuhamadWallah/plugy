# Production stack: PostgreSQL + compiled API + nginx-served SPA on a single host.
#
#   cp .env.production.example .env.production     # then fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# The `web` service listens on plain HTTP. Put a TLS-terminating proxy in front of it
# (Caddy, Cloudflare, a cloud load balancer, or host nginx + certbot). See DEPLOYMENT.md.
name: plugy-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plugy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-plugy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: production
    image: plugy-backend:production
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      # Defaults to the bundled postgres service; set DATABASE_URL to use a managed database instead
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-plugy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-plugy}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (64+ random chars) in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL (e.g. https://plugy.example.com) in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-15}
      RATE_LIMIT_JOBS_MAX: ${RATE_LIMIT_JOBS_MAX:-30}
      RATE_LIMIT_OFFERS_MAX: ${RATE_LIMIT_OFFERS_MAX:-60}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      JOB_OPEN_HOURS: ${JOB_OPEN_HOURS:-72}
      EMERGENCY_NUMBER: ${EMERGENCY_NUMBER:-112}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@plugy.app}
      ID_REQUIRED_CATEGORIES: ${ID_REQUIRED_CATEGORIES:-babysitting,care_taking}
      CURRENCY: ${CURRENCY:-USD}
      UPLOAD_DIR: /data/uploads
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    volumes:
      # Profile/job photos and private ID documents: back this up with the database
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Scheduled backups of the database and uploads (see ops/backup.sh). Back up the bundled database;
  # with a managed DATABASE_URL, use your provider's backups and keep this for uploads.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/ops/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-plugy}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-plugy}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
      - ./ops:/ops:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ./frontend
      target: production
    image: plugy-web:production
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:5000
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
    name: plugy_prod_pgdata
  uploads:
    name: plugy_prod_uploads

networks:
  internal:
    name: plugy_prod_network
